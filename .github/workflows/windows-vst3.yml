name: Windows VST3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure (VST3, tests on, normal stack baseline)
        run: cmake -S . -B Build/Windows -A x64 -DBUILD_TESTING=ON -DCHORDENGINE_WINDOWS_STACK_DIAGNOSTICS=ON

      - name: Build VST3 target
        run: cmake --build Build/Windows --config Release --target ChordEngineVST3_VST3

      - name: Build all targets including diagnostic probe
        run: cmake --build Build/Windows --config Release

      - name: Run baseline CTest (normal stack, complete output saved)
        # --output-log and --output-junit write complete results before ctest
        # exits. A failing CTest remains a failing workflow step.
        run: >-
          ctest --test-dir Build/Windows -C Release --output-on-failure
          --output-log Build/Windows/ctest-baseline-output.log
          --output-junit Build/Windows/ctest-baseline-junit.xml

      - name: Run normal-stack processor probe (both allocation modes)
        if: always()
        shell: pwsh
        run: |
          $exe = (Resolve-Path "Build/Windows/Release/ChordEngineWindowsStackProbe.exe").Path
          $failed = $false
          foreach ($mode in @('--stack', '--heap')) {
            $name = $mode.TrimStart('-')
            $out = "Build/Windows/probe-normal-$name.stdout.log"
            $err = "Build/Windows/probe-normal-$name.stderr.log"
            $p = Start-Process -FilePath $exe -ArgumentList $mode -NoNewWindow -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            "NORMAL $mode exit=$($p.ExitCode)" | Tee-Object -Append -FilePath Build/Windows/stack-experiment-summary.txt
            Get-Content $out
            if (Test-Path $err) { Get-Content $err }
            $probeOutput = (Get-Content $out -Raw).Trim() -replace '[\r\n]+', '; '
            Write-Output "::notice title=Normal stack probe::mode=$mode exit=$($p.ExitCode) $probeOutput"
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Record normal-stack exit codes for the four failing tests
        if: always()
        shell: pwsh
        run: |
          $work = (Resolve-Path 'Build/Windows').Path
          $tests = @('ChordEngineCoreTests','ChordEngineProcessorIntegrationTests','ChordEngineFunctionalTests','ChordEngineStateTests')
          $failed = $false
          foreach ($test in $tests) {
            $exe = Join-Path $work "Release/$test.exe"
            $out = "Build/Windows/normal-stack-$test.stdout.log"
            $err = "Build/Windows/normal-stack-$test.stderr.log"
            $p = Start-Process -FilePath $exe -WorkingDirectory $work -NoNewWindow -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            "NORMAL TEST $test exit=$($p.ExitCode)" | Tee-Object -Append -FilePath Build/Windows/stack-experiment-summary.txt
            Get-Content $out -Tail 40
            if (Test-Path $err) { Get-Content $err -Tail 40 }
            Write-Output "::notice title=Normal stack test $test::exit=$($p.ExitCode)"
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Reconfigure diagnostic targets with 8 MiB test stack
        if: always()
        run: >-
          cmake -S . -B Build/Windows -A x64 -DBUILD_TESTING=ON
          -DCHORDENGINE_WINDOWS_STACK_DIAGNOSTICS=ON
          -DCHORDENGINE_WINDOWS_LARGE_TEST_STACK=ON

      - name: Force relink 8 MiB probe and four test executables
        if: always()
        shell: pwsh
        run: |
          $targets = @('ChordEngineWindowsStackProbe','ChordEngineCoreTests','ChordEngineProcessorIntegrationTests','ChordEngineFunctionalTests','ChordEngineStateTests')
          foreach ($target in $targets) {
            $exe = "Build/Windows/Release/$target.exe"
            if (Test-Path $exe) { Remove-Item -LiteralPath $exe -Force }
          }
          cmake --build Build/Windows --config Release --target ChordEngineWindowsStackProbe ChordEngineCoreTests ChordEngineProcessorIntegrationTests ChordEngineFunctionalTests ChordEngineStateTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run 8 MiB stack probe (both allocation modes)
        if: always()
        shell: pwsh
        run: |
          $exe = (Resolve-Path "Build/Windows/Release/ChordEngineWindowsStackProbe.exe").Path
          $failed = $false
          foreach ($mode in @('--stack', '--heap')) {
            $name = $mode.TrimStart('-')
            $out = "Build/Windows/probe-large-$name.stdout.log"
            $err = "Build/Windows/probe-large-$name.stderr.log"
            $p = Start-Process -FilePath $exe -ArgumentList $mode -NoNewWindow -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            "LARGE $mode exit=$($p.ExitCode)" | Tee-Object -Append -FilePath Build/Windows/stack-experiment-summary.txt
            Get-Content $out
            if (Test-Path $err) { Get-Content $err }
            $probeOutput = (Get-Content $out -Raw).Trim() -replace '[\r\n]+', '; '
            Write-Output "::notice title=8 MiB stack probe::mode=$mode exit=$($p.ExitCode) $probeOutput"
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Record 8 MiB stack exit codes for the four failing tests
        if: always()
        shell: pwsh
        run: |
          $work = (Resolve-Path 'Build/Windows').Path
          $tests = @('ChordEngineCoreTests','ChordEngineProcessorIntegrationTests','ChordEngineFunctionalTests','ChordEngineStateTests')
          $failed = $false
          foreach ($test in $tests) {
            $exe = Join-Path $work "Release/$test.exe"
            $out = "Build/Windows/large-stack-$test.stdout.log"
            $err = "Build/Windows/large-stack-$test.stderr.log"
            $p = Start-Process -FilePath $exe -WorkingDirectory $work -NoNewWindow -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            "LARGE TEST $test exit=$($p.ExitCode)" | Tee-Object -Append -FilePath Build/Windows/stack-experiment-summary.txt
            Get-Content $out -Tail 40
            if (Test-Path $err) { Get-Content $err -Tail 40 }
            Write-Output "::notice title=8 MiB stack test $test::exit=$($p.ExitCode)"
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Run enlarged-stack CTest for all seven tests
        if: always()
        shell: pwsh
        run: |
          $out = 'Build/Windows/ctest-large-stack-stdout.log'
          $err = 'Build/Windows/ctest-large-stack-stderr.log'
          $p = Start-Process -FilePath 'ctest' -ArgumentList @('--test-dir','Build/Windows','-C','Release','--output-on-failure','--output-log','Build/Windows/ctest-large-stack-output.log','--output-junit','Build/Windows/ctest-large-stack-junit.xml') -NoNewWindow -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
          "LARGE FULL CTEST exit=$($p.ExitCode)" | Tee-Object -Append -FilePath Build/Windows/stack-experiment-summary.txt
          Get-Content $out -Tail 100
          if (Test-Path $err) { Get-Content $err -Tail 100 }
          Write-Output "::notice title=8 MiB full CTest::exit=$($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload stack and CTest diagnostics (always, after all experiments)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChordEngine-Windows-stack-diagnostics
          path: |
            Build/Windows/ctest-*.log
            Build/Windows/ctest-*.xml
            Build/Windows/Testing/
            Build/Windows/probe-*.log
            Build/Windows/normal-stack-*.log
            Build/Windows/large-stack-*.log
            Build/Windows/stack-experiment-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Archive VST3 bundle (only when all tests pass)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChordEngine-VST3-windows
          path: Build/Windows/ChordEngineVST3_artefacts/Release/VST3/ChordEngine.vst3
          if-no-files-found: error
